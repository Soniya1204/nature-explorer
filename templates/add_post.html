<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Post</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
  <h2 class="text-center mb-4">Add Nature Post 🌿</h2>

  <form action="/add-post" method="POST" enctype="multipart/form-data" class="mx-auto" style="max-width:600px">
    <input class="form-control mb-3" name="title" placeholder="Post title" required>

    <textarea class="form-control mb-3" name="content" placeholder="Write about nature..." required></textarea>

    <input class="form-control mb-3" type="file" name="image" required>

    <button class="btn btn-success w-100">Post</button>
  </form>

  <div class="text-center mt-3">
    <a href="/" class="text-decoration-none">← Back to Home</a>
  </div>
</div>

</body>
</html>
